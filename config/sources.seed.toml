# Verified seed sources. Every board identifier here was confirmed on 2026-10-22 by a read-only GET against the provider's documented public listing API, and each returned HTTP 200 with a non-empty job array. Identifiers are never inferred from an employer's name: an entry only appears here after its endpoint actually answered.
# Re-verify before trusting counts: a board token can be retired at any time, and this file records what was true at import, not what is true now.

