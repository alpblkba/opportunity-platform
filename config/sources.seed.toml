# Academic source. The listing page is the canonical career site for the institute and its affiliated entities; robots.txt permits /search/ and disallows only the apply paths, which this tool never visits. The adapter reads the listing table only and never follows a row through to a job or application page.
[[sources]]
key = "hpi-academic"
kind = "academic_html"
organization = "Hasso Plattner Institute"
url = "https://jobs.plattnerfoundation.org/search/"
pattern = "successfactors"
enabled = true
refresh_hours = 24
tags = ["academic", "germany", "potsdam", "research"]
notes = "shared career site: rows for affiliated Plattner Foundation entities also appear"

